# Minimal fixture pipeline config for Layer-2 governance tests
test:
  command: ""
lint:
  command: ""

output:
  discussions: ".ae/discussions/"
  plans: ".ae/plans/"
  milestones: ".ae/milestones/"
  backlog: ".ae/backlog/"
  reviews: ".ae/reviews/"
  analyses: ".ae/analyses/"

# Tech stack matters for the prefer+stack-mismatch-kill test case
tech_stack: [rust, mcp]

# No agent_libraries configured — tests project_agents path only
# (Rule 4 Layer 2 behavior for hand-written project agents)

cross_family:
  codex: false
  gemini: false

work:
  max_fix_loops: 3
  auto_pass: true
  review_mode: light
