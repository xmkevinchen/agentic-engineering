# .claude/pipeline.yml — Agentic Engineering project config
# Generated by /ae:setup
#
# Path classes (Plan 051+):
#   - `.ae/features/{active,done,abandoned,paused}/F-NNN-<slug>/` is FIXED AE internal state
#     (not configurable here). Reader skills assume this layout. Each feature dir
#     contains: index.md, analysis.md, plan.md, review.md, discussions/, milestones/.
#     Path-derived: feature ID is extracted from the parent dir name.
#
#   - `output.*` below are CONFIGURABLE legacy / customization paths. They host
#     pre-Plan-051 artifacts AND post-Plan-051 free-text or standalone artifacts
#     (plans/discussions/reviews not tied to a specific feature).
#
#   - Reader skills (ae:dashboard / ae:next / ae:retrospect / ae:plugin-stats) scan
#     BOTH locations and union the results. No surface-index pointer files.
#
#   - .ae/ is gitignored at the project root; .ae/features/ inherits that.

# --- Test, Lint & Typecheck ---
test:
  command: ""              # e.g., "just check", "npm test", "cargo test"
  framework: ""            # e.g., "pytest", "jest", "vitest", "cargo" — used by ae:testgen for framework-aware test generation

lint:
  command: ""              # e.g., "just lint", "npm run lint"

typecheck:
  command: ""              # e.g., "tsc --noEmit", "mypy .", "cargo check" — consumed by ae:work Check C.2

# --- Output Directories (optional, legacy / external-customization) ---
# New GTD-first projects don't need this block — main artifacts live in
# .ae/features/F-NNN/ (see Path classes in CLAUDE.md). Defaults are applied
# implicitly by reader skills:
#   discussions → .ae/discussions/   plans      → .ae/plans/
#   milestones  → .ae/milestones/    backlog    → .ae/backlog/
#   reviews     → .ae/reviews/       analyses   → .ae/analyses/
#
# Add slots only if you customize legacy paths (e.g., docs/* layout) or host
# free-text artifacts that don't tie to a specific feature.
#
# output:
#   discussions: "docs/discussions/"   # ae:analyze, ae:discuss
#   plans: "docs/plans/"              # ae:plan
#   milestones: "docs/milestones/"    # ae:work
#   backlog: "docs/backlog/"          # ae:work, ae:review, ae:code-review
#   reviews: "docs/reviews/"          # ae:review
#   analyses: "docs/analyses/"        # ae:think

# --- Test Plugin ---
test_plugin:
  judge: codex               # LLM-as-judge for Layer 2 behavioral checks: codex (default), gemini, or claude

# --- Ceremony Level (F-013 Z2/B-restricted) ---
# Reduce ceremony per-project for lighter iteration. Single field controls 5
# stages with existing solo paths. Default `full` preserves backward compat —
# missing field reads as `full`.
#
# Bundling rules (canonical — not duplicated in skill SKILL.md files):
#   full     → all 5 stages enabled (current behavior)
#   light    → skips work.accumulated_doodlestein + plan.doodlestein
#              + sets work.review_mode = light (when not explicitly set)
#   minimal  → light, plus skips plan.plan_review
#              Keeps work.agent_teams: true (preset does NOT disable agent_teams;
#              env var CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS is global solo mode,
#              wins over preset).
#
# 5 stages controlled (existing solo paths):
#   work.agent_teams, work.review_mode, work.accumulated_doodlestein,
#   plan.plan_review, plan.doodlestein
#
# 3 stages NOT controlled (require NEW skip code; deferred to Phase 2 BLs on demand):
#   discuss.framing_review, discuss.doodlestein, review.cross_family
#
# Precedence (highest → lowest):
#   1. Explicit per-invocation flags (--skip-review, --light, --full)
#   2. Explicit per-stage fields below (e.g., work.review_mode: full,
#      work.accumulated_doodlestein: false) — when set, win over ceremony preset
#   3. Ceremony preset bundling (this field)
#   4. Defaults (full ceremony)
ceremony: full

# --- Work Execution ---
work:
  max_fix_loops: 3           # Fix loop circuit breaker: stop after N consecutive failures on same test
  auto_pass: true            # Auto-continue when gate passes (tests green + no P1 + no drift). Set false for manual confirm every step.
  review_mode: full          # full = 3-track review (Claude+Codex+Gemini); light = Claude-only (skip cross-family). Override per-run: --light or --full.
                             # Ceremony preset may override this when not explicitly set; see ceremony: field above.
  accumulated_doodlestein: true  # Run accumulated Doodlestein review at midpoint + final step (plans >5 steps).
                                  # Ceremony preset {light, minimal} skips this when set true; existing false setting wins on conflict.
  security_patterns:         # Files matching these patterns always require human confirmation
    - "auth/*"
    - "security/*"
    - "*.env"
    - "*secret*"
    - "*credential*"
    - "*.pem"
    - "*.key"
    - "migrations/*"

# --- Agent Libraries (optional, BL-005) ---
# Declare external agent libraries AE can curate from. Multi-library supported.
# Agents are NOT auto-imported — use `/ae:setup agents --suggest` or `--add <library:name>` to curate.
# Local paths only in Phase 1; git URL / remote sources deferred to Phase 4.
# See docs/references/agent-contract.md for the frontmatter contract.
# agent_libraries:
#   - name: agency-agents                    # project-local identifier (required)
#     source: "../agency-agents"             # local path (required)
#     categories: [engineering, product]     # optional — biases smart-suggest (weight multiplier)
#     # filter: strict                       # optional — hard-filter category in --list / --suggest
#   - name: personal-agents
#     source: "~/Workspace/personal-agents"

# --- Project Agents (optional) ---
# Agents in .claude/agents/ are auto-discovered at runtime.
# Use this section only to:
#   (a) override inferred roles for hand-written agents, OR
#   (b) record upstream provenance for library-imported agents (written by `/ae:setup agents --add`).
# All agents must be in .claude/agents/ to be spawnable. CC resolves by filename stem, not the name: field.
# project_agents:
#   # Hand-written project agent (minimum form):
#   - name: security-auditor
#     role: reviewer                         # reviewer | developer | domain-expert
#     specialty: security                    # optional free-form tag
#     tech_stack: [rust, mcp]                # optional — used by smart-selection stack-mismatch signal
#
#   # Library-imported agent (--add writes these fields):
#   - name: engineering-code-reviewer        # filename stem (canonical spawn identifier)
#     role: reviewer
#     source: "agency-agents:engineering/engineering-code-reviewer.md"
#     source_sha: abc1234                    # git SHA from library; sha256 fallback when non-git
#     display_name: "Code Reviewer"          # from original name: field — shown in --list output
#     imported_at: 2026-04-18
#     modified: false                        # auto-updated by --sync on drift detection
#     priority: 50                           # optional — Rule 4 best-N ordering (default 50)
#     required: false                        # optional — when true, always spawn regardless of best-N cap

# --- Cross-Family Review ---
# Enable/disable cross-family proxy agents in Agent Teams.
# When enabled, the corresponding proxy agent joins every team.
# When disabled or MCP unavailable, the proxy is simply skipped.
#
# The KEY is an instance label, not a family name. That is deliberate: it lets two entries
# share a lineage or a host without colliding, which a family-keyed map cannot express.
#   seat     which proxy definition and tool set reaches it — agents/workflow/<seat>-proxy.md
#   family   weight lineage; this is what makes a second opinion independent
#   host     where the weights run. NOT the family — a local build of a lineage another entry
#            already covers is a sibling, not an independent party (BL-208)
#   enabled  optional; presence means enabled, `enabled: false` switches an entry off while
#            keeping its endpoint and model
#
# Entries on the generic `openai-compat` seat also take `endpoint` and `model`, and may take
# `api_key_env` naming the variable holding that backend's key. Adding a family on that seat
# costs one entry here and no new file anywhere.
#
# Coverage counts distinct `family`, never distinct label.
cross_family:
  codex:  { seat: codex,  family: openai }   # requires the codex CLI on PATH
  gemini: { seat: gemini, family: google }   # requires GEMINI_API_KEY
  # deepseek-api:   { seat: openai-compat, family: deepseek, host: vendor,
  #                   endpoint: "https://api.deepseek.com/v1", model: deepseek-reasoner,
  #                   api_key_env: DEEPSEEK_API_KEY }
  # qwen-local:     { seat: openai-compat, family: qwen, host: local,
  #                   endpoint: "http://127.0.0.1:8000/v1", model: Qwen3.5-35B-A3B-8bit }
