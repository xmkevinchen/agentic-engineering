# .claude/pipeline.yml — Agentic Engineering project config
#
# Only two things read this file today:
#   - the SessionStart hook (`scripts/check-cross-family.sh`), which probes every entry
#     under `cross_family:` and warns about the ones that are configured but unreachable;
#   - `test.command`, by convention, as the command a stage runs to turn a check red.
#
# Feature artifacts live under `.ae/features/{active,done,abandoned}/F-NNN-<slug>/`.
# That layout is fixed, not configured here, and `.ae/` is gitignored at the project root.

# --- Test, Lint & Typecheck ---
test:
  command: ""              # e.g., "just check", "npm test", "cargo test"

lint:
  command: ""              # e.g., "just lint", "npm run lint"

typecheck:
  command: ""              # e.g., "tsc --noEmit", "mypy .", "cargo check"

# --- Cross-Family Review ---
# Which proxy seats are available for a second opinion. When a family is unreachable the
# proxy is skipped, and the session-start probe says so rather than failing the session.
#
# The KEY is an instance label, not a family name. That is deliberate: it lets two entries
# share a lineage or a host without colliding, which a family-keyed map cannot express.
#   seat     which proxy definition and tool set reaches it — agents/workflow/<seat>-proxy.md
#   family   weight lineage; this is what makes a second opinion independent
#   host     where the weights run. NOT the family — a local build of a lineage another entry
#            already covers is a sibling, not an independent party
#   enabled  optional; presence means enabled, `enabled: false` switches an entry off while
#            keeping its endpoint and model
#
# Entries on the generic `openai-compat` seat also take `endpoint` and `model`, and may take
# `api_key_env` naming the variable holding that backend's key. Adding a family on that seat
# costs one entry here and no new file anywhere.
#
# Coverage counts distinct `family`, never distinct label.
cross_family:
  codex:  { seat: codex,  family: openai }   # requires the codex CLI on PATH
  gemini: { seat: gemini, family: google }   # requires GEMINI_API_KEY
  # deepseek-api:   { seat: openai-compat, family: deepseek, host: vendor,
  #                   endpoint: "https://api.deepseek.com/v1", model: deepseek-reasoner,
  #                   api_key_env: DEEPSEEK_API_KEY }
  # qwen-local:     { seat: openai-compat, family: qwen, host: local,
  #                   endpoint: "http://127.0.0.1:8000/v1", model: Qwen3.5-35B-A3B-8bit }
