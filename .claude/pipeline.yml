# .claude/pipeline.yml — Agentic Engineering (self-hosted)

# --- Artifact Root ---
# Feature artifacts live under <artifact_root>/features/{active,done,abandoned}/F-NNN-<slug>/.
# This project already keeps that tree in the independent `agent-memory` repo and only reached
# it before via a `.ae -> agent-memory` compatibility symlink (F-112 exists because that
# symlink was a workaround, not a real setting). Setting this makes agent-memory the real,
# declared root instead of an implicit target of a symlink AE itself couldn't see.
artifact_root: agent-memory

test:
  # The structural skill-frontmatter check: every SKILL.md's leading frontmatter block
  # is well-formed (single '---'-fenced block, one 'name:' matching its directory, no
  # misspelled 'user_invocable' key).
  command: "sh plugins/ae/scripts/check-skill-frontmatter.sh"

lint:
  command: ""

# --- Cross-Family ---
# Family-instance table. The KEY is an instance label, not a family — that is what lets two
# entries share a lineage (deepseek-api + deepseek-local) or a host without colliding.
#   seat   which proxy definition and tool set reaches it (agents/workflow/<seat>-proxy.md)
#   family weight lineage — what makes the opinion independent
#   host   where the weights run; NOT the family (BL-208)
# Presence means enabled; keep an entry and set `enabled: false` to switch it off without
# losing an endpoint and model you spent time getting right.
# Coverage counts distinct `family`, never distinct label: deepseek-api and deepseek-local
# are one independent opinion, not two.
cross_family:
  codex:      { seat: codex,  family: openai }
  gemini:     { seat: gemini, family: google }
  qwen-local: { seat: openai-compat, family: qwen, host: local, endpoint: "http://127.0.0.1:8000/v1", model: "Qwen3.8-27B-8bit" }
